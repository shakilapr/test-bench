[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_protocol = esptool

; N16R8: 16MB flash, 8MB Octal PSRAM
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

; Linux serial settings. Keep these commented unless flashing from Linux.
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0
monitor_speed = 115200
upload_speed = 921600
;upload_port = COM4
;monitor_port = COM4

extra_scripts = pre:scripts/secrets_to_defines.py

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -std=gnu++17
build_unflags =
    -std=gnu++11

lib_deps =
    adafruit/Adafruit ADS1X15 @ ^2.4.0
    bblanchon/ArduinoJson @ ^7.1.0
    knolleary/PubSubClient @ ^2.8

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<bench/>
build_flags =
    -std=gnu++17
    -I include
    -I src
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
test_ignore = test_embedded